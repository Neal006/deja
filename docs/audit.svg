<svg xmlns="http://www.w3.org/2000/svg" width="906" height="268" viewBox="0 0 906 268">
  <rect width="100%" height="100%" rx="10" fill="#0d1117"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <text x="20" y="63" xml:space="preserve"><tspan fill="#d2a8ff" font-weight="700">deja audit</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">— 51 Claude Code sessions (1 of them subagents), 2,924 API requests, 2026-07-27 → 2026-11-09</tspan></text>
  <text x="20" y="83" xml:space="preserve"></text>
  <text x="20" y="103" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">deja would have cut your input bill by</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787" font-weight="700">30.7%</tspan><tspan fill="#8b949e"> (≈ $68.53 at $5/M input, claude-opus-5-5)</tspan></text>
  <text x="20" y="123" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">average prompt</tspan><tspan fill="#e6edf3"> 96.0k </tspan><tspan fill="#8b949e">→</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">61.6k</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">tokens</tspan></text>
  <text x="20" y="143" xml:space="preserve"></text>
  <text x="20" y="163" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">  replayed under each strategy</tspan><tspan fill="#8b949e">  (prompt-cache billing, exact prefix matching)</tspan></text>
  <text x="20" y="183" xml:space="preserve"><tspan fill="#e6edf3">    as it happened          $223          </tspan></text>
  <text x="20" y="203" xml:space="preserve"><tspan fill="#e6edf3">    eager pruning           $188 </tspan><tspan fill="#7ee787"> -15.8%</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">what typical context pruners do</tspan></text>
  <text x="20" y="223" xml:space="preserve"><tspan fill="#e6edf3">    deja, dedup only        $222 </tspan><tspan fill="#7ee787">  -0.6%</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">cache-neutral back-references</tspan></text>
  <text x="20" y="243" xml:space="preserve"><tspan fill="#e6edf3">    deja                    $155 </tspan><tspan fill="#7ee787"> -30.7%</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">dedup + cache-aware decay</tspan></text>
  </g>
</svg>
